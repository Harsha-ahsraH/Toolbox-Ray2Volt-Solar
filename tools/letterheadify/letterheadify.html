<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterheadify - Ray2Volt Toolbox</title>
    <link rel="icon" href="data:,">
    <meta name="description" content="Add Ray2Volt letterhead to every page of an uploaded PDF.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Flex:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- PDF processing -->
    <script src="../../global/vendor/pdf-lib.min.js?v=20260930-cleanup"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../global/styles/base.css?v=20260930-cleanup">
    <link rel="stylesheet" href="../../global/styles/navigation.css?v=20260930-cleanup">
    <link rel="stylesheet" href="../../global/styles/components.css?v=20260930-cleanup">
    <link rel="stylesheet" href="../../global/styles/responsive.css?v=20260930-cleanup">
    <link rel="stylesheet" href="letterheadify.css?v=20260930-cleanup">
    <!-- Theme: stamps light or dark on <html> before the first paint -->
    <script src="../../global/scripts/theme.js?v=20260930-cleanup"></script>
</head>

<body>
    <div class="app-container">
        <main class="main-content">
            <section id="letterhead-documents-section" class="content-section active">
                <div class="lhd-tool">
                    <div class="tool-header">
                        <h1>Letterheadify</h1>
                        <p>Upload a PDF and download a copy with the Ray2Volt letterhead applied to every page.</p>
                    </div>

                    <div class="card lhd-upload">
                        <h3 class="card-title">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            PDF Upload
                        </h3>

                        <label class="lhd-file-drop" for="lhdPdfInput">
                            <input type="file" id="lhdPdfInput" accept="application/pdf">
                            <span class="lhd-file-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                </svg>
                            </span>
                            <span class="lhd-file-title" id="lhdFileTitle">Choose PDF</span>
                            <span class="lhd-file-meta" id="lhdFileMeta">No file selected</span>
                        </label>

                        <div class="actions">
                            <button type="button" id="lhdProcessBtn" class="btn btn-primary" disabled>Add Letterhead &amp; Download</button>
                        </div>

                        <div class="lhd-status" id="lhdStatus" role="status">Waiting for a PDF.</div>
                    </div>
                </div>
            </section>
        </main>
    </div>


    <script src="../../global/scripts/tools.js?v=20260930-cleanup"></script>
    <script src="../../global/scripts/auth.js?v=20260930-cleanup" data-tool-id="letterheadify"></script>
    <script src="../../global/scripts/navigation.js?v=20260930-cleanup"></script>
    <script src="letterheadify.js?v=20260930-cleanup"></script>
</body>

</html>
