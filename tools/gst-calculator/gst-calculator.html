<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Calculator - Ray2Volt Toolbox</title>
    <link rel="icon" href="data:,">
    <meta name="description" content="Add or remove GST for inter/intra-state transactions with detailed breakdown.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Flex:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="../../global/styles/base.css?v=20260930-restore-typography">
    <link rel="stylesheet" href="../../global/styles/navigation.css?v=20260930-no-interface-logos">
    <link rel="stylesheet" href="../../global/styles/components.css">
    <link rel="stylesheet" href="../../global/styles/responsive.css?v=20260930-sidebar-resize">
    <!-- Theme: stamps light or dark on <html> before the first paint -->
    <script src="../../global/scripts/theme.js"></script>
</head>

<body>
    <div class="app-container">
        <main class="main-content">
            <section id="gst-calculator-section" class="content-section active">

                <div class="tool-header">
                    <h1>GST Calculator</h1>
                    <p>Add or remove GST for inter-state and intra-state transactions with detailed breakdown.</p>
                </div>

                <div class="card">
                    <div class="split">

                        <!-- Inputs -->
                        <div>
                            <h3 class="card-title">Input Details</h3>

                            <div class="field">
                                <label for="gstAmount">Amount</label>
                                <input type="number" id="gstAmount" class="input" placeholder="Enter amount" inputmode="decimal">
                            </div>

                            <div class="field">
                                <label for="gstRate">Total GST Rate (%)</label>
                                <input type="number" id="gstRate" class="input" value="18" inputmode="decimal">
                                <div class="segmented" aria-label="Common GST rates">
                                    <button type="button" class="segmented-btn gst-rate-btn" data-rate="0">0%</button>
                                    <button type="button" class="segmented-btn gst-rate-btn" data-rate="5">5%</button>
                                    <button type="button" class="segmented-btn gst-rate-btn" data-rate="12">12%</button>
                                    <button type="button" class="segmented-btn gst-rate-btn active" data-rate="18">18%</button>
                                    <button type="button" class="segmented-btn gst-rate-btn" data-rate="28">28%</button>
                                </div>
                            </div>

                            <div class="field">
                                <span class="field-label">Calculation Method</span>
                                <div class="segmented">
                                    <button type="button" id="addGstBtn" class="segmented-btn active">Add GST</button>
                                    <button type="button" id="removeGstBtn" class="segmented-btn">Remove GST</button>
                                </div>
                            </div>

                            <div class="field">
                                <span class="field-label">Transaction Type</span>
                                <div class="segmented">
                                    <button type="button" id="intraStateBtn" class="segmented-btn active">Intra-State (SGST + CGST)</button>
                                    <button type="button" id="interStateBtn" class="segmented-btn">Inter-State (IGST)</button>
                                </div>
                            </div>
                        </div>

                        <!-- Results -->
                        <div>
                            <h3 class="card-title">GST Breakdown</h3>

                            <div class="table-wrap">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Description</th>
                                            <th class="num">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>Base Amount</td>
                                            <td class="num" id="baseAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr id="intraStateOutput">
                                            <td>CGST</td>
                                            <td class="num" id="cgstAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr id="intraStateOutput2">
                                            <td>SGST</td>
                                            <td class="num" id="sgstAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr id="interStateOutput" style="display: none;">
                                            <td>IGST</td>
                                            <td class="num" id="igstAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr class="total-row">
                                            <td>Total Amount (Incl. GST)</td>
                                            <td class="num" id="totalAmountOutput">₹0.00</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
        </main>
    </div>


    <script src="../../global/scripts/tools.js"></script>
    <script src="../../global/scripts/auth.js?v=20260930-restore-typography" data-tool-id="gst-calculator"></script>
    <script src="../../global/scripts/navigation.js?v=20260930-sidebar-resize"></script>
    <script src="gst-calculator.js"></script>
</body>

</html>
