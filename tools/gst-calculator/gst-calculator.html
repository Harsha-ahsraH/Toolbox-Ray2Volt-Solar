<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Calculator - Ray2Volt Toolbox</title>
    <link rel="icon" href="data:,">
    <meta name="description" content="Add or remove GST for inter/intra-state transactions with detailed breakdown.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Flex:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="../../global/styles/base.css?v=20260930-restore-typography">
    <link rel="stylesheet" href="../../global/styles/navigation.css?v=20260930-no-interface-logos">
    <link rel="stylesheet" href="../../global/styles/components.css">
    <link rel="stylesheet" href="../../global/styles/responsive.css?v=20260930-sidebar-resize">
    <!-- GST Calculator Specific Styles -->
    <link rel="stylesheet" href="gst-calculator.css?v=20260930-restore-typography">
    <!-- Theme: stamps light or dark on <html> before the first paint -->
    <script src="../../global/scripts/theme.js"></script>
</head>

<body>
    <div class="app-container">
        <main class="main-content">
            <section id="gst-calculator-section" class="content-section active">

                <!-- Page Header -->
                <div class="gst-page-header">
                    <h1>GST Calculator</h1>
                    <p>Add or remove GST for inter-state and intra-state transactions with detailed breakdown.</p>
                </div>

                <!-- Calculator Main Card -->
                <div class="gst-calculator-card">
                    <div class="gst-grid">

                        <!-- Left Column: Inputs -->
                        <div class="gst-inputs-section">
                            <h3 class="section-title">Input Details</h3>

                            <!-- Amount Input -->
                            <div class="gst-input-group">
                                <label for="gstAmount">Amount</label>
                                <input type="number" id="gstAmount" class="gst-input-field" placeholder="Enter amount">
                            </div>

                            <!-- GST Rate Input -->
                            <div class="gst-input-group">
                                <label for="gstRate">Total GST Rate (%)</label>
                                <input type="number" id="gstRate" class="gst-input-field" value="18">
                                <div class="gst-rate-selector">
                                    <button class="gst-rate-btn" data-rate="0">0%</button>
                                    <button class="gst-rate-btn" data-rate="5">5%</button>
                                    <button class="gst-rate-btn" data-rate="12">12%</button>
                                    <button class="gst-rate-btn active" data-rate="18">18%</button>
                                    <button class="gst-rate-btn" data-rate="28">28%</button>
                                </div>
                            </div>

                            <!-- Calculation Method -->
                            <div class="gst-control-group">
                                <strong>Calculation Method</strong>
                                <div class="gst-toggle-buttons">
                                    <button id="addGstBtn" class="gst-toggle-btn active">Add GST</button>
                                    <button id="removeGstBtn" class="gst-toggle-btn">Remove GST</button>
                                </div>
                            </div>

                            <!-- Transaction Type -->
                            <div class="gst-control-group">
                                <strong>Transaction Type</strong>
                                <div class="gst-toggle-buttons">
                                    <button id="intraStateBtn" class="gst-toggle-btn active">Intra-State (SGST +
                                        CGST)</button>
                                    <button id="interStateBtn" class="gst-toggle-btn">Inter-State (IGST)</button>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Results -->
                        <div class="gst-results-section">
                            <h3 class="section-title">GST Breakdown</h3>

                            <!-- Results Table -->
                            <div class="gst-table-wrapper">
                                <table class="gst-table">
                                    <thead>
                                        <tr>
                                            <th>Description</th>
                                            <th>Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>Base Amount</td>
                                            <td id="baseAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr id="intraStateOutput">
                                            <td>CGST</td>
                                            <td id="cgstAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr id="intraStateOutput2">
                                            <td>SGST</td>
                                            <td id="sgstAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr id="interStateOutput" style="display: none;">
                                            <td>IGST</td>
                                            <td id="igstAmountOutput">₹0.00</td>
                                        </tr>
                                        <tr class="gst-table-total">
                                            <td>Total Amount (Incl. GST)</td>
                                            <td id="totalAmountOutput">₹0.00</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
        </main>
    </div>


    <script src="../../global/scripts/tools.js"></script>
    <script src="../../global/scripts/auth.js?v=20260930-restore-typography" data-tool-id="gst-calculator"></script>
    <script src="../../global/scripts/navigation.js?v=20260930-sidebar-resize"></script>
    <script src="gst-calculator.js"></script>
</body>

</html>
