<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request for Quotation - Ray2Volt Toolbox</title>
    <link rel="icon" href="data:,">
    <meta name="description" content="Generate professional Request for Quotations from Markdown.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Flex:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Marked JS for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../global/styles/base.css?v=20260930-restore-typography">
    <link rel="stylesheet" href="../../global/styles/navigation.css?v=20260930-no-interface-logos">
    <link rel="stylesheet" href="../../global/styles/components.css">
    <link rel="stylesheet" href="../../global/styles/responsive.css?v=20260930-sidebar-resize">
    <link rel="stylesheet" href="request-for-quotation.css?v=20260930-restore-typography">
    <!-- Theme: stamps light or dark on <html> before the first paint -->
    <script src="../../global/scripts/theme.js"></script>
</head>

<body>
    <div class="app-container">
        <main class="main-content">
            <section id="rfq-section" class="content-section active">

                <div class="no-print-area">
                    <!-- Page Header -->
                    <div class="tool-header">
                        <h1>Request for Quotation Generator</h1>
                        <p>Generate professional Request for Quotations from Markdown text.</p>
                    </div>

                    <!-- Form Grid -->
                    <div class="form-grid">
                        <!-- Vendor Details Card -->
                        <div class="card">
                            <h3 class="card-title">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                Vendor Details
                            </h3>
                            <div class="field">
                                <label for="rfqVendorName">Vendor Name</label>
                                <input type="text" id="rfqVendorName" class="input" placeholder="Enter vendor name">
                            </div>
                            <div class="field">
                                <label for="rfqVendorAddress">Address (Optional)</label>
                                <textarea id="rfqVendorAddress" class="input" rows="2"
                                    placeholder="Enter vendor address"></textarea>
                            </div>
                            <div class="field">
                                <label for="rfqVendorPhone">Phone Number (Optional)</label>
                                <input type="text" id="rfqVendorPhone" class="input" placeholder="Enter phone number">
                            </div>
                            <div class="field">
                                <label for="rfqVendorEmail">Email (Optional)</label>
                                <input type="email" id="rfqVendorEmail" class="input"
                                    placeholder="Enter email address">
                            </div>
                            <div class="field">
                                <label for="rfqVendorGstin">Vendor GSTIN (Optional)</label>
                                <input type="text" id="rfqVendorGstin" class="input" placeholder="Enter vendor GSTIN">
                            </div>
                        </div>

                        <!-- RFQ Settings Card -->
                        <div class="card">
                            <h3 class="card-title">
                                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                </svg>
                                RFQ Settings
                            </h3>
                            <div class="field">
                                <label for="rfqHeading">Document Heading</label>
                                <input type="text" id="rfqHeading" class="input" value="REQUEST FOR QUOTATION" placeholder="e.g. REQUEST FOR QUOTATION">
                            </div>
                            <div class="field">
                                <label for="rfqDate">RFQ Date</label>
                                <input type="date" id="rfqDate" class="input">
                            </div>
                            <div class="field">
                                <label for="rfqNumber">RFQ Number</label>
                                <input type="text" id="rfqNumber" class="input"
                                    placeholder="e.g. R2VRFQ0125-0001">
                            </div>
                        </div>
                    </div>

                    <!-- Markdown Text Area Card -->
                    <div class="card">
                        <h3 class="card-title">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                            </svg>
                            Request Body (Markdown)
                        </h3>
                        <div class="field">
                            <label for="rfqBody">Enter request content in Markdown format</label>
                            <textarea id="rfqBody" class="input input-code" rows="15"
                                placeholder="### Scope of Supply&#10;Please provide a quotation for the following items:&#10;&#10;1. **Solar Panels:** 10 x 550Wp Monocrystalline&#10;2. **Inverter:** 1 x 5kW Hybrid Inverter&#10;&#10;*Note: Ensure delivery within 10 working days.*"></textarea>
                            <span class="field-hint">Use standard Markdown syntax (# for headers, * for lists, ** for bold, etc.). We use marked.js to compile it.</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="actions">
                        <button id="rfqGenerateBtn" class="btn btn-primary">Generate RFQ Preview</button>
                        <button id="rfqPrintBtn" class="btn btn-secondary">Print / Save as PDF</button>
                    </div>
                </div>

                <!-- Paginated Request for Quotation Preview -->
                <div id="rfqPreview" aria-live="polite"></div>

                <!-- Every generated A4 sheet is cloned from this template. -->
                <template id="rfqPageTemplate">
                    <article class="rfq-page">
                    <header class="invoice-header rfq-page-header">
                        <div class="invoice-title-section">
                            <h1 data-rfq-heading>REQUEST FOR QUOTATION</h1>
                            <p data-rfq-number>R2VRFQ...</p>
                        </div>
                        <div class="invoice-logo-section">
                            <img src="../../global/assets/logo.png" alt="Ray2Volt Logo" class="invoice-logo">
                        </div>
                    </header>

                    <main class="rfq-page-main">
                    <table class="invoice-unified-table" data-rfq-first-page-details>
                        <colgroup>
                            <col style="width: 50%;">
                            <col style="width: 50%;">
                        </colgroup>
                        <!-- Info Section Header Row -->
                        <tr class="info-header-row">
                            <td class="info-header-cell">From:</td>
                            <td class="info-header-cell">Vendor:</td>
                        </tr>
                        <!-- Info Section Content Row -->
                        <tr class="info-content-row">
                            <td class="from-cell">
                                <h3 class="company-name-bold">Ray2Volt Solar Private Limited</h3>
                                <p>1-278, Pichatur road, Srikalahasti, 517640, Andhra Pradesh.</p>
                                <p><span class="invoice-info-label">Phone:</span> +91 96 6606 8140</p>
                                <p><span class="invoice-info-label">Email:</span> ray2voltsolar@gmail.com</p>
                                <br>
                                <p><span class="invoice-info-label">GSTIN:</span> 37AAOCR4626E1Z6</p>
                                <p><span class="invoice-info-label">CIN:</span> U35104AP2025PTC118526</p>
                            </td>
                            <td class="to-cell">
                                <p><span class="invoice-info-label">Name:</span> <span data-rfq-vendor-name></span></p>
                                <p><span class="invoice-info-label">Address:</span> <span data-rfq-vendor-address></span></p>
                                <p><span class="invoice-info-label">Phone Number:</span> <span data-rfq-vendor-phone></span></p>
                                <p><span class="invoice-info-label">Email:</span> <span data-rfq-vendor-email></span></p>
                                <br>
                                <p><span class="invoice-info-label">GSTIN:</span> <span data-rfq-vendor-gstin></span></p>
                                <p><span class="invoice-info-label">Date:</span> <span data-rfq-date></span></p>
                            </td>
                        </tr>
                    </table>

                    <div class="rfq-body-content" data-rfq-page-body></div>
                    </main>

                    <footer class="rfq-document-footer rfq-page-footer">
                        <div class="rfq-footer-rule"></div>
                        <div class="rfq-footer-content">
                            <span class="rfq-footer-company">Ray2Volt Solar Private Limited</span>
                            <span class="rfq-footer-notice">System-generated document; no physical signature required.</span>
                            <span class="rfq-footer-reference">RFQ <span data-rfq-footer-number>R2VRFQ...</span><br><span data-rfq-page-number>Page 1 of 1</span></span>
                        </div>
                    </footer>
                    </article>
                </template>
            </section>
        </main>
    </div>


    <script src="../../global/scripts/tools.js"></script>
    <script src="../../global/scripts/auth.js?v=20260930-restore-typography" data-tool-id="request-for-quotation"></script>
    <script src="../../global/scripts/navigation.js?v=20260930-sidebar-resize"></script>
    <script src="request-for-quotation.js?v=20260930-remove-pdf-metadata"></script>
</body>

</html>
