    <path d="M655 206L693 176L731 206" stroke="#6D55B8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M666 204V236H720V204" stroke="#6D55B8" stroke-width="5" stroke-linejoin="round"/>
    <rect x="686" y="220" width="15" height="16" rx="2" fill="#F6F4FF" stroke="#6D55B8" stroke-width="4"/>
    <text x="693" y="254" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Home Loads</text>
    <text x="693" y="276" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">Primary consumption</text>
  </g>

  <g filter="url(#shadow)">
