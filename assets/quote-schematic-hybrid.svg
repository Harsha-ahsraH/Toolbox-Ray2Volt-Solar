    <circle cx="941" cy="194" r="31" fill="#FFFFFF" stroke="#0E927E" stroke-width="4"/>
    <path d="M941 194L958 181" stroke="#0E927E" stroke-width="5" stroke-linecap="round"/>
    <path d="M941 164V173M971 194H962M941 224V215M911 194H920" stroke="#0E927E" stroke-width="4" stroke-linecap="round"/>
    <text x="941" y="254" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Meter / Grid</text>
    <text x="941" y="276" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">Optional support</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="136" width="116" height="142" rx="20" fill="#FFFFFF" stroke="#D8E0E7"/>
    <path d="M1078 238L1098 170L1118 238" stroke="#667085" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1085 216H1111M1090 196H1106M1068 238H1128" stroke="#667085" stroke-width="5" stroke-linecap="round"/>
    <text x="1098" y="262" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">DISCOM</text>
  </g>

  <path d="M242 232H312" stroke="#1678B8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M506 207H590" stroke="#0E927E" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
  <path d="M415 282V326" stroke="#2E8B57" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M439 326V286" stroke="#2E8B57" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrowGreen)"/>
  <path d="M693 282V326" stroke="#6D55B8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <path d="M786 207H850" stroke="#667085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGrid)"/>
  <path d="M1022 197H1030" stroke="#667085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGrid)"/>
  <path d="M1030 226H1022" stroke="#667085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGrid)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
