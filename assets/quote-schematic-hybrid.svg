    <rect x="374" y="164" width="82" height="58" rx="10" fill="#F6FAFC" stroke="#566677" stroke-width="4"/>
    <path d="M448 170L382 216" stroke="#1678B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M390 181H403M390 193H403" stroke="#1678B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M419 205C425 195 431 195 437 205C443 215 449 215 455 205" stroke="#0E927E" stroke-width="4" stroke-linecap="round"/>
    <text x="415" y="254" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Hybrid Inverter</text>
    <text x="415" y="276" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">Solar and battery control</text>
  </g>

  <g filter="url(#shadow)">
