    <text x="290" y="213" text-anchor="middle" fill="#1678B8">DC</text>
    <rect x="535" y="172" width="52" height="24" rx="12" fill="#E9FAF6" stroke="#BCE7DF"/>
    <text x="561" y="189" text-anchor="middle" fill="#0E927E">AC</text>
    <rect x="455" y="306" width="86" height="24" rx="12" fill="#ECFAF0" stroke="#C9E9D1"/>
    <text x="498" y="323" text-anchor="middle" fill="#2E8B57">Battery</text>
