<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid rooftop solar system schematic</title>
  <desc id="desc">Solar PV modules feed a hybrid inverter, battery bank, home loads, backup loads, and optional grid support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="1" stop-color="#ECF8F2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245C94"/>
      <stop offset="1" stop-color="#12375F"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEFDF3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#23704A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#1678B8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#0E927E"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#2E8B57"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#6D55B8"/>
    </marker>
    <marker id="arrowGrid" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#FFFFFF"/>
  <path d="M78 420C198 334 289 363 400 408C508 452 623 451 747 390C868 331 970 313 1124 368" stroke="#EEF6F1" stroke-width="28" stroke-linecap="round" opacity=".7"/>
  <path d="M102 78H1098" stroke="#DCE9F1" stroke-width="1"/>
  <path d="M102 420H1098" stroke="#DCE9F1" stroke-width="1"/>

  <text x="82" y="52" fill="#183F36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Hybrid / Off-Grid Solar Energy Flow</text>
  <text x="82" y="80" fill="#5E766C" font-family="Arial, Helvetica, sans-serif" font-size="15">Solar generation, battery storage, backup supply, and grid support for priority loads.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="178" height="164" rx="20" fill="#FFFFFF" stroke="#C9E5F2"/>
    <g transform="translate(92 178)">
      <rect x="0" y="0" width="116" height="78" rx="6" fill="url(#panel)" stroke="#74B7DA" stroke-width="2"/>
      <path d="M29 0V78M58 0V78M87 0V78M0 26H116M0 52H116" stroke="#88C8E8" stroke-width="2"/>
      <path d="M38 80L28 112M78 80L88 112M22 112H94" stroke="#4A6677" stroke-width="5" stroke-linecap="round"/>
      <circle cx="98" cy="-18" r="17" fill="#F5B942"/>
      <path d="M98 -47V-36M98 0V11M69 -18H80M116 -18H127M78 -38L86 -30M110 -6L118 2M78 2L86 -6M110 -30L118 -38" stroke="#F5B942" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="149" y="289" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Solar PV Array</text>
    <text x="149" y="311" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">DC generation</text>
  </g>

