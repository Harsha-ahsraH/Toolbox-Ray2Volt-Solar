    <circle cx="693" cy="382" r="22" fill="#F6F4FF" stroke="#6D55B8" stroke-width="4"/>
    <path d="M693 404V419M682 419H704M684 379L691 386L704 369" stroke="#6D55B8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="693" y="427" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Backup Loads</text>
  </g>

  <g filter="url(#shadow)">
