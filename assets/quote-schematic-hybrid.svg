    <rect x="371" y="370" width="76" height="38" rx="8" fill="#FFFFFF" stroke="#2E8B57" stroke-width="4"/>
    <rect x="447" y="382" width="9" height="14" rx="2" fill="#2E8B57"/>
    <path d="M388 389H405M424 380V398M415 389H433" stroke="#2E8B57" stroke-width="5" stroke-linecap="round"/>
    <text x="415" y="427" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Battery Bank</text>
  </g>

  <g filter="url(#shadow)">
