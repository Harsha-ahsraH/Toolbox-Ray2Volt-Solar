<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">On-grid rooftop solar system schematic</title>
  <desc id="desc">Solar PV modules feed an inverter, protection equipment, net meter, home loads, and the utility grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="1" stop-color="#ECF7FB"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245C94"/>
      <stop offset="1" stop-color="#12375F"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF8FD"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEFDF9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#165C7D" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#1678B8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#0E927E"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#6D55B8"/>
    </marker>
    <marker id="arrowGrid" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#FFFFFF"/>
  <path d="M84 420C191 349 287 388 396 418C496 446 602 462 720 399C824 344 933 291 1116 344" stroke="#EDF5F9" stroke-width="28" stroke-linecap="round" opacity=".65"/>
  <path d="M102 78H1098" stroke="#DCE9F1" stroke-width="1"/>
  <path d="M102 420H1098" stroke="#DCE9F1" stroke-width="1"/>

  <text x="82" y="52" fill="#1B3F57" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">On-Grid Solar Energy Flow</text>
  <text x="82" y="80" fill="#5D7281" font-family="Arial, Helvetica, sans-serif" font-size="15">Generation, conversion, protection, consumption, and grid exchange in one connected system.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="146" width="178" height="164" rx="20" fill="url(#blueCard)" stroke="#C9E5F2"/>
    <g transform="translate(92 174)">
      <rect x="0" y="0" width="116" height="78" rx="6" fill="url(#panel)" stroke="#74B7DA" stroke-width="2"/>
      <path d="M29 0V78M58 0V78M87 0V78M0 26H116M0 52H116" stroke="#88C8E8" stroke-width="2"/>
      <path d="M38 80L28 112M78 80L88 112M22 112H94" stroke="#4A6677" stroke-width="5" stroke-linecap="round"/>
      <circle cx="98" cy="-18" r="17" fill="#F5B942"/>
      <path d="M98 -47V-36M98 0V11M69 -18H80M116 -18H127M78 -38L86 -30M110 -6L118 2M78 2L86 -6M110 -30L118 -38" stroke="#F5B942" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="149" y="285" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Solar PV Array</text>
    <text x="149" y="307" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">DC generation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="306" y="156" width="154" height="144" rx="20" fill="#FFFFFF" stroke="#D8E5EC"/>
    <rect x="350" y="185" width="66" height="58" rx="9" fill="#F6FAFC" stroke="#566677" stroke-width="4"/>
    <path d="M410 191L356 237" stroke="#1678B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M363 202H376M363 214H376" stroke="#1678B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M389 226C395 216 401 216 407 226C413 236 419 236 425 226" stroke="#0E927E" stroke-width="4" stroke-linecap="round"/>
    <text x="383" y="278" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Solar Inverter</text>
    <text x="383" y="300" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">DC to AC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="528" y="156" width="154" height="144" rx="20" fill="#FFFFFF" stroke="#D8E5EC"/>
    <path d="M605 181L637 193V217C637 239 622 254 605 264C588 254 573 239 573 217V193L605 181Z" fill="#FFF7EA" stroke="#D9902F" stroke-width="4" stroke-linejoin="round"/>
    <path d="M591 219L601 229L620 205" stroke="#D9902F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="605" y="278" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ACDB / DCDB</text>
    <text x="605" y="300" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">Isolation and SPD</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="156" width="154" height="144" rx="20" fill="url(#tealCard)" stroke="#C8E7E0"/>
    <circle cx="827" cy="212" r="33" fill="#FFFFFF" stroke="#0E927E" stroke-width="4"/>
    <path d="M827 212L845 198" stroke="#0E927E" stroke-width="5" stroke-linecap="round"/>
    <path d="M827 181V190M858 212H849M827 243V234M796 212H805" stroke="#0E927E" stroke-width="4" stroke-linecap="round"/>
    <path d="M811 253H843" stroke="#0E927E" stroke-width="5" stroke-linecap="round"/>
    <text x="827" y="278" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Net Meter</text>
    <text x="827" y="300" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">Import and export</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="344" width="154" height="104" rx="20" fill="#FFFFFF" stroke="#DED8F2"/>
    <path d="M789 400L827 370L865 400" stroke="#6D55B8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M800 398V430H854V398" stroke="#6D55B8" stroke-width="5" stroke-linejoin="round"/>
    <rect x="820" y="414" width="15" height="16" rx="2" fill="#F6F4FF" stroke="#6D55B8" stroke-width="4"/>
    <text x="827" y="432" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Home Loads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="982" y="156" width="154" height="144" rx="20" fill="#FFFFFF" stroke="#D8E0E7"/>
    <path d="M1036 250L1059 181L1082 250" stroke="#667085" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1044 226H1074M1050 206H1068M1026 250H1092" stroke="#667085" stroke-width="5" stroke-linecap="round"/>
    <path d="M1048 180H1070" stroke="#667085" stroke-width="5" stroke-linecap="round"/>
    <text x="1059" y="278" text-anchor="middle" fill="#18384F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Utility Grid</text>
    <text x="1059" y="300" text-anchor="middle" fill="#667A88" font-family="Arial, Helvetica, sans-serif" font-size="13">DISCOM supply</text>
  </g>

  <path d="M242 228H292" stroke="#1678B8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M464 228H514" stroke="#0E927E" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
  <path d="M686 228H736" stroke="#0E927E" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
  <path d="M827 306V333" stroke="#6D55B8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <path d="M908 215H968" stroke="#667085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGrid)"/>
  <path d="M968 242H910" stroke="#667085" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGrid)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    <rect x="256" y="193" width="52" height="24" rx="12" fill="#EAF6FC" stroke="#B7DCEE"/>
    <text x="282" y="210" text-anchor="middle" fill="#1678B8">DC</text>
    <rect x="478" y="193" width="52" height="24" rx="12" fill="#E9FAF6" stroke="#BCE7DF"/>
    <text x="504" y="210" text-anchor="middle" fill="#0E927E">AC</text>
    <rect x="700" y="193" width="52" height="24" rx="12" fill="#E9FAF6" stroke="#BCE7DF"/>
    <text x="726" y="210" text-anchor="middle" fill="#0E927E">AC</text>
    <rect x="923" y="181" width="62" height="24" rx="12" fill="#F3F5F7" stroke="#D7DDE2"/>
    <text x="954" y="198" text-anchor="middle" fill="#667085">Export</text>
    <rect x="923" y="250" width="62" height="24" rx="12" fill="#F3F5F7" stroke="#D7DDE2"/>
    <text x="954" y="267" text-anchor="middle" fill="#667085">Import</text>
  </g>
</svg>
